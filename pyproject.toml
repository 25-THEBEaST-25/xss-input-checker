[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xss-input-checker"
version = "1.1.0"
description = "Detect common cross-site scripting payloads in untrusted input."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
xss-check = "xss_checker.cli:main"

[tool.setuptools]
packages = ["xss_checker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["xss_checker", "tests", "checker.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
